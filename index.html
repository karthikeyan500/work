<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <p class="eyebrow">Daily Planner</p>
          <h1>To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="What needs to be done?"
            aria-label="New task"
            autocomplete="off"
          />
          <button type="submit">Add Task</button>
        </form>

        <div class="toolbar">
          <span id="todo-count">0 tasks left</span>
          <div class="filters" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="task-check">
          <input type="checkbox" />
          <span class="checkmark"></span>
        </label>
        <span class="task-text"></span>
        <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
